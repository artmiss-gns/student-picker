[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-selector"
version = "0.1.0"
description = "Lightweight, projection-safe presentation selector and strike tracker for university tutorials and lab courses."
readme = "README.md"
authors = [{ name = "Artmiss" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["teaching", "education", "tutorial", "presentation", "random-selector", "grading", "ta"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Education",
]

[project.scripts]
ta-selector = "ta_selector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
