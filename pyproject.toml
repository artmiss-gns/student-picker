[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "student-picker"
version = "0.1.0"
description = "A simple script to pick random students for class presentations and keep track of who presented."
readme = "README.md"
authors = [{ name = "Artmiss" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
student-picker = "student_picker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
